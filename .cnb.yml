.gradle-check: &gradle-check
  docker:
    image: eclipse-temurin:25-jdk
    volumes:
      - main:/root/.gradle:copy-on-write
  stages:
    - name: prepare
      script:
        - chmod +x ./gradlew
        - java -version
        - ./gradlew --no-daemon --version
    - name: check
      script: ./gradlew --no-daemon check

.gradle-pr-check: &gradle-pr-check
  <<: *gradle-check
  docker:
    image: eclipse-temurin:25-jdk
    volumes:
      - main:/root/.gradle:copy-on-write-read-only

.gradle-publish: &gradle-publish
  <<: *gradle-check
  imports:
    - https://cnb.cool/wwang3/configs/-/blob/main/token.yml
  stages:
    - name: prepare
      script:
        - chmod +x ./gradlew
        - java -version
        - ./gradlew --no-daemon --version
        - chmod +x ./.cnb/publish.sh
    - name: check
      script: ./gradlew --no-daemon check
    - name: publish
      script: .cnb/publish.sh
      exports:
        stderr: ERROR_INFO
    - name: email-notify
      image:
        name: docker.cnb.cool/wwang3/email-notification-plugin:0.0.1
        dockerUser: cnb
        dockerPassword: ${CNB_OI_TOKEN}
      settings:
        username: ${NOTIFY_EMAIL_USER}
        password: ${NOTIFY_EMAIL_PASS}
        host: ${NOTIFY_EMAIL_HOST}
        port: ${NOTIFY_EMAIL_PORT}
        receiver: ${NOTIFY_EMAIL_RECEIVER}
        subject: "slf4k ci result"
        content: "success"
  failStages:
    - name: fail-email-notify
      image:
        name: docker.cnb.cool/wwang3/email-notification-plugin:0.0.1
        dockerUser: cnb
        dockerPassword: ${CNB_OI_TOKEN}
      settings:
        username: ${NOTIFY_EMAIL_USER}
        password: ${NOTIFY_EMAIL_PASS}
        host: ${NOTIFY_EMAIL_HOST}
        port: ${NOTIFY_EMAIL_PORT}
        receiver: ${NOTIFY_EMAIL_RECEIVER}
        subject: "sfl4k ci failed"
        content: ${ERROR_INFO}"

include:
  - ".cnb/remote-dev.yml"

"$":
  push:
    - name: gradle-check
      <<: *gradle-check
  pull_request:
    - name: gradle-pr-check
      <<: *gradle-pr-check
  tag_push:
    - name: gradle-publish
      <<: *gradle-publish
