$:
  # vscode 事件：专供页面中启动远程开发用
  vscode:
    - imports: https://cnb.cool/wwang3/configs/-/blob/main/token.yml
      docker:
        image:
          name: docker.cnb.cool/wwang3/remote-dev-backend:1.1.0
          dockerUser: cnb
          dockerPassword: ${CNB_API_TOKEN}
      runner:
        cpus: 16
      services:
        - vscode
        - docker
      stages:
        - name: set-ssh-env
          script: /usr/cnb/update_ssh_env.sh
        - name: install-tool&restore-config
          script: /usr/cnb/cnb.sh
        - name: set-git
          image: tencentcom/git-set-credential:latest
          settings:
            userName: ${CNB_GIT_USER}
            userEmail: ${CNB_GIT_EMAIL}
            loginUserName: ${CNB_GIT_USER}
            loginPassword: ${CNB_API_TOKEN}
        - name: install-ccstatusline
          script: npm install -g ccstatusline-zh
        - name: vscode-go
          type: vscode:go
